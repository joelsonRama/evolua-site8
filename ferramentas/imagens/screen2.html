<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:540px;height:1012px;overflow:hidden;font-family:Inter,sans-serif;background:#e8eef8}
.app{width:540px;height:1012px;display:flex;flex-direction:column;background:#e8eef8;color:#0b1a3a}
.top{display:flex;align-items:center;gap:14px;padding:30px 20px 18px;background:linear-gradient(90deg,#071a4a,#0d2e7a,#1546b8);color:#fff}
.menu{width:30px;height:22px;background:linear-gradient(#fff,#fff) 0 0/100% 4px no-repeat,linear-gradient(#fff,#fff) 0 50%/100% 4px no-repeat,linear-gradient(#fff,#fff) 0 100%/100% 4px no-repeat}
.top img{width:52px;height:52px}
.top b{display:block;font-size:17px;font-weight:900;letter-spacing:3px}.top b span{color:#67e8f9}
.top strong{display:block;font-size:27px;font-weight:800;line-height:1.1}
.top small{display:flex;align-items:center;gap:8px;font-size:17px;color:#c7d5f5}.top small i{width:12px;height:12px;border-radius:50%;background:#4ade80}
.chips{display:flex;gap:10px;padding:14px 16px 8px}
.chips span{padding:9px 18px;border-radius:999px;font-size:18px;font-weight:700;background:#fff;border:2px solid #c6d3ea;color:#4b5c7e}
.chips span.on{background:#1652f0;border-color:#1652f0;color:#fff}
.grid{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:repeat(4,1fr);gap:10px;padding:6px 14px 12px}
.grid div{position:relative;display:flex;flex-direction:column;border-radius:16px;background:#fff;border:2px solid #c6d3ea;overflow:hidden;box-shadow:0 2px 6px rgba(11,26,58,.06)}
.grid .ph{flex:1;min-height:0;background:#fff center/contain no-repeat;margin:6px 6px 0;border-radius:10px}
.grid .ph.cover{background-size:cover;margin:0;border-radius:0}
.grid p{padding:6px 6px 8px;text-align:center;border-top:4px solid var(--c)}
.grid b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid small{display:block;font-size:15px;font-weight:800;color:#0b6fa8;margin-top:1px}
.grid em{position:absolute;z-index:2;top:6px;right:6px;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-style:normal;font-size:16px;font-weight:900;background:#15803d;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.bottom{display:flex;align-items:center;gap:12px;padding:18px 18px 22px;background:linear-gradient(90deg,#071a4a,#0d2e7a,#1546b8);color:#fff}
.bottom div{flex:1}.bottom small{display:block;font-size:17px;color:#c7d5f5}.bottom b{font-size:38px;font-weight:900}
.bottom span{padding:18px 26px;border-radius:14px;background:#2b8cff;font-weight:900;font-size:21px;letter-spacing:1px}
</style></head><body><div class="app" id="app"></div>
